<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#04060a">
  <title>AFTERSIGNAL — Prologue Relay V0.66</title>
  <style>
    @font-face{font-family:CombatKR;src:url("../assets/fa6767788359138e7825.woff2") format("woff2");font-weight:700 900;font-display:swap}
    @font-face{font-family:RelayDisplay;src:url("../assets/5b7e4a6f97163c263672.woff2") format("woff2");font-weight:700;font-display:swap}
    @font-face{font-family:SignalMark;src:url("../assets/d887437e7949fd394c3a.bin") format("truetype");font-weight:400 900;font-display:swap}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#04060a;color:#f8fbff;font-family:CombatKR,"Noto Sans KR",sans-serif}

    /* ------------------------------------------------------------ stage: one WebGL canvas (live-2D scene) + DOM labels */
    .title-stage{
      position:relative;width:100%;height:100%;min-height:440px;overflow:hidden;isolation:isolate;background:#04060a;
      --logo-w:clamp(300px,43vw,1000px);--logo-x:4.4vw;--logo-y:11vh;--ink-x:calc(var(--logo-x) + var(--logo-w)*.075);--beat:.12;
    }
    #gl{position:absolute;inset:0;z-index:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .7s ease}
    .title-stage[data-live=on] #gl{opacity:1}
    .title-stage[data-live=pending]:after{content:"";position:absolute;left:50%;top:50%;z-index:1;width:170px;height:2px;margin-left:-85px;
      background:linear-gradient(90deg,transparent,#7feeff,transparent);opacity:0;animation:loader 1.1s ease-in-out .6s infinite alternate}

    /* static layout: only shown when WebGL2 is unavailable (data-live=off) */
    .fb{display:none;position:absolute}
    .title-stage[data-live=off] .fb{display:block}
    .fb-bg{inset:0;z-index:0;background:#070d17 url("../assets/title_v2/title_bg_v2.webp") 56% 47%/cover no-repeat}
    .fb-shade{inset:0;z-index:1;background:radial-gradient(ellipse at 66% 30%,rgba(110,225,255,.12),transparent 38%),linear-gradient(90deg,rgba(1,3,8,.55),rgba(1,4,10,.05) 55%,rgba(1,3,8,.35)),linear-gradient(0deg,rgba(0,3,9,.92) 2%,rgba(0,3,9,.35) 26%,transparent 56%)}
    .fb-hero{z-index:2;left:calc(var(--hx,0)*1px);top:calc(var(--hy,0)*1px);width:calc(1024px*var(--hs,.6));height:calc(1536px*var(--hs,.6));
      background:url("../assets/title_v2/mira_title_hero_v2.png") 0 0/100% 100% no-repeat;filter:drop-shadow(0 0 22px rgba(120,232,255,.3))}

    /* ------------------------------------------------------------ logo (drawn into the canvas; the slot only tells it where) */
    .logo-slot{position:absolute;z-index:3;left:var(--logo-x);top:var(--logo-y);width:var(--logo-w);aspect-ratio:1749/467;margin:0;pointer-events:none}
    .logo-slot .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
    .fb-logo{inset:0;background:url("../assets/title_v2/title_logo_v2.webp") center/contain no-repeat;filter:drop-shadow(0 0 16px rgba(70,220,255,.4))}

    /* ------------------------------------------------------------ labels */
    .topline,.tagline,.title-action,.settings{opacity:0}
    .topline{position:absolute;z-index:3;left:var(--ink-x);top:5.4vh;display:flex;align-items:center;gap:12px;color:#d9f6ff;font:700 16px/1 RelayDisplay,sans-serif;letter-spacing:.2em;text-shadow:0 2px 8px #000,0 0 12px rgba(80,210,255,.35)}
    .topline i{display:block;width:30px;height:2px;background:#7bedff;box-shadow:0 0 14px #7bedff}
    .tagline{position:absolute;z-index:3;left:var(--ink-x);top:calc(var(--logo-y) + var(--logo-w)*.267 + 1.6vh);margin:0;color:#bfeefa;font:700 clamp(12px,.95vw,17px)/1 RelayDisplay,sans-serif;letter-spacing:.36em;text-shadow:0 2px 10px #000,0 0 16px rgba(70,205,255,.4)}
    .title-action{position:absolute;z-index:4;left:var(--ink-x);bottom:8vh;display:flex;flex-direction:column;align-items:flex-start;gap:18px}
    .version{color:#c5d6df;font:700 15px/1.55 CombatKR,sans-serif;letter-spacing:.04em;text-shadow:0 2px 8px #000}
    .version b{display:block;margin-bottom:5px;color:#82f0ff;font:700 15px/1 RelayDisplay,sans-serif;letter-spacing:.16em}

    /* start: chamfered cyan-glass plate whose glow follows the scene's heartbeat (--beat is written by the engine) */
    .cta{filter:drop-shadow(0 0 calc(7px + 24px*var(--beat)) rgba(70,225,255,calc(.16 + .42*var(--beat)))) drop-shadow(0 8px 14px rgba(0,0,0,.6))}
    .start{position:relative;display:block;min-width:clamp(260px,23vw,400px);margin:0;padding:2px;border:0;cursor:pointer;color:#ecffff;font:900 clamp(21px,1.62vw,31px)/1 CombatKR,sans-serif;letter-spacing:.2em;
      background:linear-gradient(100deg,#8af6ff,#3ba9d8 42%,#d3fcff 58%,#4fc9e9);
      clip-path:polygon(17px 0,100% 0,100% calc(100% - 17px),calc(100% - 17px) 100%,0 100%,0 17px);transition:filter .16s ease,transform .16s ease}
    .start-in{position:relative;display:flex;align-items:center;justify-content:center;gap:16px;overflow:hidden;padding:21px 34px 22px;
      background:linear-gradient(100deg,rgba(5,26,42,.95),rgba(9,50,72,.92) 55%,rgba(5,26,42,.95));
      clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);text-shadow:0 0 12px rgba(120,240,255,.7),0 2px 2px #000;transition:background .16s ease}
    .start-in:before{content:"";flex:none;width:0;height:0;border-left:11px solid #8cf6ff;border-top:7px solid transparent;border-bottom:7px solid transparent;filter:drop-shadow(0 0 5px rgba(130,246,255,.9))}
    .start-in:after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:38%;background:linear-gradient(100deg,transparent,rgba(190,255,255,.3),transparent);transform:skewX(-20deg);animation:sweep 5.4s ease-in-out 4.6s infinite}
    .start:hover,.start:focus-visible{outline:none;filter:brightness(1.12);transform:translateY(-2px)}
    .start:hover .start-in,.start:focus-visible .start-in{background:linear-gradient(100deg,rgba(14,68,96,.97),rgba(28,112,142,.95) 55%,rgba(14,68,96,.97))}
    .start:focus-visible{background:#fff}
    .start:active{transform:translateY(0);filter:brightness(1.25)}

    .settings{position:absolute;z-index:4;right:3.2vw;top:4.6vh;display:flex;align-items:center;gap:8px;margin:0;padding:10px 18px 10px 14px;border:1px solid rgba(130,232,255,.4);border-radius:999px;background:rgba(3,14,26,.5);
      color:#d9f0f7;font:700 clamp(14px,1vw,17px)/1 CombatKR,sans-serif;cursor:pointer;text-shadow:0 2px 4px #000;transition:background .16s ease,border-color .16s ease,color .16s ease}
    .settings:before{content:"◇";color:#86edf8}
    .settings:hover,.settings:focus-visible{outline:none;color:#fff;border-color:#a8f4ff;background:rgba(10,52,74,.72)}

    /* entry choreography: starts when the scene itself starts (host audio gate + intro movie are gone) */
    .run .topline{animation:fadeIn 1s ease .5s both}
    .run .tagline{animation:fadeUp 1s ease 2.7s both}
    .run .title-action{animation:fadeUp .9s cubic-bezier(.16,.8,.2,1) 3.1s both}
    .run .settings{animation:fadeIn 1s ease 3.5s both}

    .boot{position:absolute;z-index:9;inset:0;display:grid;place-items:center;background:#020509;opacity:0;visibility:hidden;transition:opacity .26s ease .2s,visibility 0s linear .46s}
    .boot.show{visibility:visible;opacity:1;transition:opacity .26s ease .2s,visibility 0s}
    .boot b{color:#e8faff;font:700 20px/1 RelayDisplay,sans-serif;letter-spacing:.2em}
    .boot i{display:block;width:210px;height:2px;margin-top:15px;background:linear-gradient(90deg,transparent,#7feeff,transparent);animation:bootLine .7s ease-in-out infinite alternate}

    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @keyframes sweep{0%,72%{left:-60%}100%{left:135%}}
    @keyframes loader{to{opacity:.8;transform:scaleX(.5)}}
    @keyframes bootLine{to{transform:scaleX(.45);opacity:.45}}

    /* portrait / narrow windows (the scene switches to its portrait layout below 1.15:1) */
    @media(max-aspect-ratio:115/100){
      .title-stage{--logo-w:min(88vw,600px);--logo-x:calc(50vw - var(--logo-w)/2);--logo-y:5.2vh;--ink-x:50vw}
      .topline{display:none}
      .tagline{transform:translateX(-50%);white-space:nowrap;font-size:clamp(10px,2.9vw,15px);letter-spacing:.3em}
      .title-action{left:50%;bottom:5.5vh;width:100%;align-items:center;transform:translateX(-50%)}
      .start{min-width:min(84vw,360px)}
      .version{text-align:center;font-size:13px}
      .settings{top:2.2vh;right:3.6vw;padding:8px 14px 8px 11px}
      .run .tagline{animation-name:fadeUpC}
      .run .title-action{animation-name:fadeUpC}
    }
    @keyframes fadeUpC{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}

    @media(prefers-reduced-motion:reduce){
      .start-in:after{animation:none}
      .run .topline,.run .tagline,.run .title-action,.run .settings{animation-duration:.01s;animation-delay:0s}
    }
  </style>
</head>
<body>
  <main class="title-stage" id="stage" data-live="pending" aria-label="AFTERSIGNAL 타이틀 화면">
    <div class="fb fb-bg" aria-hidden="true"></div><div class="fb fb-shade" aria-hidden="true"></div><div class="fb fb-hero" aria-hidden="true"></div>
    <canvas id="gl" aria-hidden="true"></canvas>
    <h1 class="logo-slot" id="logoSlot"><span class="sr">AFTER SIGNAL</span><i class="fb fb-logo" aria-hidden="true"></i></h1>
    <div class="topline"><i></i>RELAY PROTOCOL // 01</div>
    <p class="tagline">WHEN THE SILENCE CALLS BACK</p>
    <div class="title-action"><div class="cta"><button id="start" class="start" type="button"><span class="start-in">새 작전 시작</span></button></div><div class="version"><b>RELAY BUILD // V0.66</b>R-0 LUMEN RELAY LINK READY</div></div>
    <button class="settings" type="button" aria-label="게임 설정" data-af-settings-open>게임 설정</button>
    <div id="boot" class="boot" aria-live="polite"><div><b>OPENING RELAY CHANNEL</b><i></i></div></div>
  </main>
  <script>
    document.getElementById('start').addEventListener('click',()=>{try{['aftersignal:profile:v3','aftersignal:pending-reward:v3','aftersignal:commander-name:v3'].forEach(key=>localStorage.removeItem(key));for(let index=localStorage.length-1;index>=0;index--){const key=localStorage.key(index);if(key?.startsWith('aftersignal:party-loadout:'))localStorage.removeItem(key)}const profile={version:'3.0',unlockedCharacterIds:['mira'],commander:{name:'',level:1,xp:0},resources:{credits:0,battleData:0,coreSignal:0,weaponModules:0},characters:{mira:{unlocked:true}},weapons:[],inventory:{weaponBoxes:0},clears:{},rewardClaims:{},progress:{currentPrologueStage:'P-01',prologueComplete:false,temporaryBaseUnlocked:false}};localStorage.setItem('aftersignal:profile:v3',JSON.stringify(profile))}catch{}const boot=document.getElementById('boot');boot.classList.add('show');setTimeout(()=>parent.postMessage({type:"aftersignal:navigate",screen:"prologue"},"*"),480)});
  </script>
<script>
(() => {
  if (window.parent === window) return;
  let sent = false;
  const unlock = () => {
    if (sent) return;
    sent = true;
    window.parent.postMessage({ type: "aftersignal:audio-unlock" }, "*");
  };
  window.addEventListener("pointerdown", unlock, { passive: true });
  window.addEventListener("keydown", unlock);
  const result = document.getElementById("resultOverlay");
  if (result) new MutationObserver(() => {
    const won = !result.classList.contains("hidden") && (document.getElementById("resultText")?.textContent || "").includes("3/3 회수 완료");
    if (won) window.parent.postMessage({ type: "aftersignal:bgm", cue: "p04_resolution" }, "*");
  }).observe(result, { attributes: true, attributeFilter: ["class"] });
})();
</script>
<script src="../shared/title/AFTERSIGNAL_TITLE_LIVE2D_V1.js?build=20261001tl2"></script>
<script>
/* live-2D title scene (shared/title/AFTERSIGNAL_TITLE_LIVE2D_V1.js). Without WebGL2 the page keeps the static layout below. */
(() => {
  const stage = document.getElementById('stage'), live = window.AfterSignalTitleLive2D;
  const run = () => stage.classList.add('run');
  const layoutFallback = () => {
    const w = stage.clientWidth || innerWidth, h = stage.clientHeight || innerHeight, a = w / h; let sc, ox, oy;
    if (a >= 1.15) { sc = h * .965 / 1002; const fx = Math.min(.665, Math.max(.54, .42 + .1 * a)); ox = w * fx - 520 * sc; oy = h * .04 - 8 * sc; }
    else { sc = Math.min(w * 1.02 / 640, h * .78 / 1002); ox = w * .5 - 560 * sc; oy = h * .21 - 8 * sc; }
    stage.style.setProperty('--hx', ox.toFixed(1)); stage.style.setProperty('--hy', oy.toFixed(1)); stage.style.setProperty('--hs', sc.toFixed(4));
  };
  const fallback = () => { stage.dataset.live = 'off'; layoutFallback(); addEventListener('resize', layoutFallback); run(); };
  if (new URLSearchParams(location.search).get('manual') === '1') run();
  document.getElementById('start').addEventListener('click', () => { try { live && live.triggerStart(); } catch (e) { /* the page keeps working without the scene */ } });
  if (!live) return fallback();
  live.init({
    canvas: document.getElementById('gl'), stage, logoSlot: document.getElementById('logoSlot'), onActive: run, onFail: fallback,
    assets: { bg: '../assets/title_v2/title_bg_v2.webp', logo: '../assets/title_v2/title_logo_v2.webp', hero: '../assets/title_v2/mira_title_hero_v2.png', masks: '../assets/title_v2/mira_title_masks_v2.png' }
  }).then(ok => { if (ok) stage.dataset.live = 'on'; else fallback(); }).catch(fallback);
})();
</script>
<script src="../shared/foundation/AFTERSIGNAL_GAME_SETTINGS_V1.js?build=20260929set2"></script>
</body>
</html>
