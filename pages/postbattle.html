  <script>
    const scenes = [{"speaker":"서술","label":"P-01 · AFTER ACTION","text":"마지막 적성 신호가 꺼지자, 폐쇄 릴레이 기지에는 녹은 성에가 떨어지는 소리와 과열된 전력관의 울림만 남았다.","mode":"wide"},{"speaker":"미라 보스","label":"FIELD LINK // MIRA","text":"교전 종료. 비상 전원 계통은 살아 있습니다. 사령관, 아직 일어나지 마세요. 생체 캡슐에서 깨어난 직후예요.","mode":"mira"},{"speaker":"사령관","label":"RELAY // UNKNOWN ID","text":"사령관이라고 부르지 마. 나는 내 이름도, 여기 온 이유도 기억하지 못해. 방금 내가 뭘 한 건지도 모르겠어.","mode":"first"},{"speaker":"미라 보스","label":"FIELD LINK // MIRA","text":"교전 판단은 제가 했습니다. 당신은 릴레이가 표시한 위험 지점과 후퇴 경로를 골랐고, 시스템이 입력을 전술 신호로 보정했어요. 능숙하게 지휘한 게 아닙니다. 살아남기 위해 필요한 선택만 한 겁니다.","mode":"mira-close"},{"speaker":"사령관","label":"RELAY // UNKNOWN ID","text":"그런데 손은 망설이지 않았어. 머리는 비어 있는데, 어느 경로를 끊어야 하는지는 알고 있었어. 그게 내 기억인지, 이 장치가 밀어 넣은 습관인지 구분이 안 돼.","mode":"first"},{"speaker":"기지 시스템","label":"IDENTITY HANDSHAKE","text":"생체 키 일치. 구 릴레이 사령 권한의 소유자를 확인했습니다. 인격 연속성은 검증할 수 없습니다.","mode":"system"},{"speaker":"사령관","label":"RELAY // UNKNOWN ID","text":"좋아. 그럼 권한도 증명이 될 때까지 제한해. 나는 이동 경로와 철수만 승인한다. 사격과 현장 판단은 미라가 맡는다.","mode":"first"},{"speaker":"미라 보스","label":"FIELD LINK // MIRA","text":"동의합니다. 임시 권한으로 기록하겠습니다. 당신이 누구였는지와 지금 누구인지는 같은 질문이 아니니까요.","mode":"mira"},{"speaker":"기지 시스템","label":"P-01 RESULT","text":"비상 전원과 제어실 접근로를 복구했습니다. 다만 붕괴한 정비 구획의 원본 로그 일부는 회수하지 못했습니다.","mode":"report"},{"speaker":"사령관","label":"RELAY // UNKNOWN ID","text":"승리 보고서에 반대 의견도 넣어. 놓친 대가를 지우지 마.","mode":"first"},{"speaker":"미라 보스","label":"FIELD LINK // MIRA","text":"원본과 손실 내역을 함께 묶었습니다. 책임 부분도 따로 지우지 않겠습니다.","mode":"mira-close"},{"speaker":"사령관","label":"RELAY // UNKNOWN ID","text":"성공만 남기지 마. 갈린 판단까지 적어. 다음 팀이 같은 값을 목숨으로 치르지 않게.","mode":"first"},{"speaker":"미라 보스","label":"FIELD LINK // MIRA","text":"……그 말버릇까지 같군요.","mode":"mira-dim"},{"speaker":"사령관","label":"RELAY // UNKNOWN ID","text":"지금, 나를 알고 있다는 표정이었어.","mode":"first"},{"speaker":"미라 보스","label":"FIELD LINK // MIRA","text":"같은 생체 키가 같은 사람을 뜻하지는 않습니다. 기억도 선택도 없는 사람에게 과거의 책임부터 씌우고 싶지 않아요.","mode":"mira-close"},{"speaker":"기지 시스템","label":"CONTROL ROOM PING","text":"제어실 심부에서 미약한 인격 아카이브 신호를 감지했습니다. 식별자: MIRA VOSS / AFTERSIGNAL FRAME.","mode":"archive"},{"speaker":"사령관","label":"RELAY // UNKNOWN ID","text":"미라 보스. 저 안에 있는 게 너야?","mode":"first"},{"speaker":"미라 보스","label":"FIELD LINK // MIRA","text":"현재의 저는 생존을 위해 급히 정착시킨 전투 파티션에 가깝습니다. 제 기억의 원본과 잠겨 있는 권한은……저 아카이브 안에 있을 가능성이 큽니다.","mode":"mira-dim"},{"speaker":"아카이브 음성","label":"DEGRADED RECORD // 00:00:03","text":"……호출명 확인. 릴레이 사령관, 응답해 주십시오.","mode":"archive-voice"},{"speaker":"사령관","label":"RELAY // UNKNOWN ID","text":"방금, 나를 다른 이름으로 부르려다 멈췄어.","mode":"first"},{"speaker":"미라 보스","label":"FIELD LINK // MIRA","text":"프레임 정착 오류일 수 있습니다. 지금은 보관실 확보가 먼저예요.","mode":"mira"},{"speaker":"사령관","label":"RELAY // UNKNOWN ID","text":"오류라고 하기엔 네 목소리가 너무 확신에 차 있었어.","mode":"first"},{"speaker":"미라 보스","label":"FIELD LINK // MIRA","text":"맞습니다. 그래서 더 늦기 전에 살아남아야 합니다. 설명할 기회마저 잃고 싶지는 않으니까요.","mode":"mira-close"},{"speaker":"서술","label":"NEXT SIGNAL","title":"관 속의 목소리","text":"복구된 전력이 제어실 아래의 침수 통로를 비춘다. 기억을 잃은 사령관과 불완전한 미라는, 서로의 원본이 잠든 보관실로 향한다.","mode":"chapter"}];
    const story = document.getElementById("story");
    const dialogue = document.getElementById("dialogue");
    const speaker = document.getElementById("speaker");
    const label = document.getElementById("label");
    const line = document.getElementById("line");
    const chapterTitle = document.getElementById("chapterTitle");
    const progress = document.getElementById("progress");
    let index = 0;
    let auto = false;
    let timer = 0;
    let hidden = false;
    function render(nextIndex, instant) {
      index = Math.max(0, Math.min(scenes.length - 1, nextIndex));
      const scene = scenes[index];
      if (!instant) dialogue.classList.add("changing");
      window.clearTimeout(timer);
      window.setTimeout(function () {
        story.dataset.mode = scene.mode;
        speaker.textContent = scene.speaker;
        dialogue.toggleAttribute("data-af-narration", scene.speaker === "서술" && !/^chapter/.test(scene.mode));
        label.textContent = scene.label;
        line.textContent = scene.text;
        chapterTitle.textContent = scene.title || "";
        progress.style.width = ((index + 1) / scenes.length * 100) + "%";
        dialogue.classList.remove("changing");
        scheduleAuto();
      }, instant ? 0 : 120);
    }
    function next() {
      if (index < scenes.length - 1) render(index + 1, false);
    }
    function scheduleAuto() {
      window.clearTimeout(timer);
      if (!auto || index >= scenes.length - 1) return;
      timer = window.setTimeout(next, Math.max(Math.min(8500, 2200 + scenes[index].text.length * 64), window.AfterSignalStoryVoice?.holdMs() || 0));
    }
    dialogue.addEventListener("click", function (event) {
      if (event.target.closest("button")) return;
      next();
    });
    dialogue.addEventListener("keydown", function (event) {
      if (event.key === "Enter" || event.key === " ") { event.preventDefault(); next(); }
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === " " || event.key === "Enter" || event.key === "ArrowRight") { event.preventDefault(); next(); }
      if (event.key.toLowerCase() === "a") document.getElementById("autoButton").click();
    });
    document.getElementById("autoButton").addEventListener("click", function () {
      auto = !auto;
      this.textContent = auto ? "● AUTO" : "AUTO";
      scheduleAuto();
    });
    document.getElementById("hideButton").addEventListener("click", function () {
      hidden = !hidden;
      dialogue.style.visibility = hidden ? "hidden" : "visible";
      this.textContent = hidden ? "◩ SHOW" : "HIDE";
    });
    document.getElementById("logButton").addEventListener("click", function () {
      window.alert(scenes.slice(0, index + 1).map(function (item) { return (item.speaker === "서술" ? "" : item.speaker + " | ") + item.text; }).join("\n\n"));
    });
    document.getElementById("skipButton").addEventListener("click", function () { render(scenes.length - 1, false); });
    document.getElementById("endAction").addEventListener("click", function () {
      if (window.parent !== window) {
        window.parent.postMessage({ type: "aftersignal:navigate", screen: "p02" }, "*");
      } else {
        window.location.href = "AFTERSIGNAL_P02_STORY_V0_27_STANDALONE.html";
      }
    });
    render(0, true);
  </script>
<script>
(() => {
  if (window.parent === window) return;
  let sent = false;
  const unlock = () => {
    if (sent) return;
    sent = true;
    window.parent.postMessage({ type: "aftersignal:audio-unlock" }, "*");
  };
  window.addEventListener("pointerdown", unlock, { passive: true });
  window.addEventListener("keydown", unlock);
  const result = document.getElementById("resultOverlay");
  if (result) new MutationObserver(() => {
    const won = !result.classList.contains("hidden") && (document.getElementById("resultText")?.textContent || "").includes("3/3 회수 완료");
