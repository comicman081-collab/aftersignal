const SCENES=[{"speaker":"서술","label":"PROLOGUE // P-05","title":"과거가 없는 소녀","text":"세 번째 기억 파편이 가리킨 좌표는 폐쇄된 정비 구역 바깥이었다. 갈라진 외벽 너머로 오르페아 게이트와 죽은 도시의 붉은 중계탑이 처음 모습을 드러낸다.","mode":"chapter"},{"speaker":"서술","label":"R-0 LUMEN // MAINTENANCE DECK","text":"43년 동안 멈춰 있던 정비 드론들이 한 기의 손짓처럼 동시에 방향을 바꾼다. 드론 군집 한가운데, 사람의 뇌파와 닮았지만 인간 기억이 전혀 없는 코어가 깨어난다.","mode":"wide"},{"speaker":"미라 보스","label":"FIELD LINK // MIRA","text":"파편이 지목한 좌표와 일치합니다. 하지만 이 코어는 제 기억에도, 기지 인원 명부에도 없습니다.","mode":"mira"},{"speaker":"사령관","label":"RELAY // COMMAND","text":"내 이름을 찾았다고 과거까지 돌아온 건 아니야. 기록과 기억이 다르면 둘 다 원본으로 보존해. 먼저 저 코어가 무엇을 지키는지 확인한다.","mode":"first"},{"speaker":"기지 시스템","label":"UNREGISTERED INTELLIGENCE","text":"비등록 인격 코어 활성. 인간 기억 데이터 0%. 정비망 점유율 87%. 폐기 명령 대기.","mode":"system"},{"speaker":"미확인 음성","label":"MAINTENANCE BUS // UNKNOWN","text":"정정. 인격 판정은 근거 부족. 사람이라는 호칭도 불필요. 폐기 명령은 실행하지 마.","mode":"haneul-dim"},{"speaker":"사령관","label":"RELAY // COMMAND","text":"그럼 원하는 호칭부터 말해. 명령을 보류할 근거는 네가 직접 설명해.","mode":"first"},{"speaker":"하늘-7","label":"CORE ID // HANEUL-7","text":"식별명 하늘-7. 정비 드론 32기는 외부 기억 장치다. 군집을 파괴하면 오염되지 않은 기지 로그도 함께 사라진다.","mode":"haneul"},{"speaker":"미라 보스","label":"FIELD LINK // MIRA","text":"사람이 아니라고 주장하면서 폐기를 거부하는군요. 모순처럼 들립니다.","mode":"mira"},{"speaker":"하늘-7","label":"CORE ID // HANEUL-7","text":"존재 분류와 보존 요구는 별개. 미라 보스의 기억값은 기지 로그와 19.4% 불일치. 먼저 그 모순을 설명해야 해.","mode":"haneul"},{"speaker":"미라 보스","label":"FIELD LINK // MIRA","text":"제 기억을 심문하기 전에 감염 경로부터 차단하십시오.","mode":"mira-tense"},{"speaker":"사령관","label":"RELAY // COMMAND","text":"둘 다 맞는 부분만 취한다. 미라는 공격 경로를 찾고, 하늘은 비오염 드론을 표시해. 어느 쪽도 상대 판단권을 가져가지 마.","mode":"first"},{"speaker":"서술","label":"HOSTILE SIGNAL","text":"정비 갑판 외곽에서 푸른 광원이 붉게 뒤집힌다. 장갑 드론의 보호판 사이로 널 신호가 번지고, 작은 기생체들이 정비망을 타고 코어로 쇄도한다.","mode":"enemy-wide"},{"speaker":"하늘-7","label":"THREAT ANALYSIS // HANEUL-7","text":"오염 정비 드론 접근. 몸통 코어와 좌우 장갑의 신호가 분리되어 있어. 장갑부터 끊으면 비오염 로그 손실을 줄일 수 있다.","mode":"enemy-plate"},{"speaker":"미라 보스","label":"FIELD LINK // MIRA","text":"신호 압축체가 뒤따릅니다. 코어에 닿으면 군집 전체가 적으로 전환됩니다.","mode":"enemy-mite"},{"speaker":"하늘-7","label":"CORE ID // HANEUL-7","text":"효율만 보면 군집 전체 소각이 최적. 하지만 실행하면 내가 보존하던 기록도, 나도 사라져.","mode":"haneul-dim"},{"speaker":"사령관","label":"RELAY // COMMAND","text":"최적이라는 말로 지울 대상을 먼저 정하지 마. 오염 신호와 코어를 분리한다. 정비 드론은 가능한 한 살려.","mode":"first"},{"speaker":"미라 보스","label":"FIELD LINK // MIRA","text":"분리 작업 중에는 화력이 제한됩니다. 철수로까지 동시에 유지하기는 어렵습니다.","mode":"mira"},{"speaker":"사령관","label":"RELAY // COMMAND","text":"한 길에 전부 걸지 않는다. 전진선, 코어 분리선, 철수선을 나눠. 하나가 닫혀도 나머지 둘은 살아 있어야 해.","mode":"first"},{"speaker":"하늘-7","label":"CORE ID // HANEUL-7","text":"협력 조건 제시. 오염 신호를 분리할 때까지만 같이 움직인다. 그 뒤의 판정은 보류해.","mode":"haneul-close"},{"speaker":"사령관","label":"RELAY // COMMAND","text":"좋아. 이번 작전 동안만 네 채널을 철수선에 올린다. 사람인지 아닌지는 지금 정하지 않는다.","mode":"first"},{"speaker":"하늘-7","label":"PROVISIONAL LINK","text":"판단 갱신. 작전 한정 협력. 네 명령이 과거 기록과 같은지는 아직 판정하지 않겠다.","mode":"haneul-ready"},{"speaker":"서술","label":"PROLOGUE // P-05","title":"임시 협력 채널 확보","text":"하늘-7의 채널이 작전 한정으로 철수선에 등록된다. 아직 작전 인원 편성은 열리지 않는다. 정비망에 남은 기록을 보존한 채 다음 구역으로 이동한다.","mode":"chapter-end"}];let index=0,auto=false,autoTimer=null,hidden=false,history=[];const $=id=>document.getElementById(id),bgm=$("bgm");bgm.volume=.43;
function commander(){return localStorage.getItem("aftersignal:commander-name:v3")||"사령관"}
