 {mode:"mira haneul sera",speaker:"사령관",label:"COMMAND // CHAPTER ONE",text:"짧은 길은 버린다. 구조 요청이 유인이어도 발신 원본은 남아 있어. 보관층을 지나 제어실로 간다."},

 {mode:"mira haneul sera",speaker:"사령관",label:"COMMAND // COST OF TITLE",text:"좋아. 지휘권은 계속 잠근다. 미라는 연결 해제 권한을, 하늘은 독립 철수 채널을 유지해. 되찾은 이름 뒤에 숨지 않고 이 직함의 비용부터 배운다."},
