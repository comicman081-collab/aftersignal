  <script>
    const scenes = [{"speaker":"서술","label":"P-03 // AFTER ACTION","text":"과전류 포탑의 잔광이 꺼진다. 강제 접속 장치가 우회되고, 미라의 동의를 확인한 채 현재 연결된 채널 하나만 안정 링크를 맺는다.","mode":"wide"},{"speaker":"기지 시스템","label":"RELAY CORE // STABLE","text":"현재 안정 링크 인원 1. 미등록 신호는 당사자의 합류와 동의가 확인될 때까지 전술 채널에 연결하지 않습니다.","mode":"system"},{"speaker":"미라 보스","label":"FIELD LINK // MIRA","text":"순차 활성화가 완료됐습니다. 좌석 아래에서 전투 기록 파편이 발견됐습니다. 제 기억보다 오래된 원본일 가능성이 있습니다.","mode":"mira"},{"speaker":"서술","label":"PROLOGUE // P-04","title":"남겨진 발자국","text":"격리 구역의 문이 열린다. 손바닥만 한 기록 파편 세 개가 서로 다른 시간대의 명령을 반복하고 있다.","mode":"chapter-open"},{"speaker":"기억 파편 01","label":"DEGRADED COMMAND LOG","text":"……전원 동기화. 판단 지연을 제거한다. 반대 의견은 전투 종료 뒤 기록한다.","mode":"archive-voice"},{"speaker":"사령관","speakerRole":"commander","label":"RELAY // UNKNOWN ID","text":"내 목소리처럼 들리지만, 내가 내린 명령이라는 기억은 없어. 원본과 편집 흔적을 분리해서 보자.","mode":"first"},{"speaker":"미라 보스","label":"ARCHIVE ANALYSIS // MIRA","text":"동의합니다. 음성 일치만으로 당신의 선택이었다고 단정하지 않겠습니다. 두 번째 파편에서 개인 등록 영역이 열립니다.","mode":"mira-dim"},{"speaker":"기지 시스템","label":"IDENTITY FRAGMENT // RECOVERED","text":"마지막 릴레이 사령관의 등록명이 음성 파형으로 복구됐습니다. 들려온 이름을 확인하십시오.","mode":"system","requiresName":true},{"speaker":"{{playerName}}","speakerRole":"commander","label":"IDENTITY // ACCEPTED","text":"{{playerName}}. 기억이 돌아온 건 아니지만, 이 이름이 나를 가리켰다는 건 알겠어. 지금의 나도 이 이름을 사용하겠다.","mode":"first"},{"speaker":"미라 보스","label":"FIELD LINK // PERSONAL","text":"확인했습니다, {{miraPersonal}}. 과거 기록이 아니라 지금 당신이 받아들인 이름으로 저장하겠습니다.","mode":"mira-close"},{"speaker":"{{playerName}}","speakerRole":"commander","label":"RELAY // NAMED","text":"작전 중에는 지금처럼 사령관이라고 불러. 이름은 명령권이 아니라 내가 돌아갈 곳을 기억하기 위해 남겨 두자.","mode":"first"},{"speaker":"미라 보스","label":"FIELD LINK // MIRA","text":"알겠습니다. 공개 전술 채널에서는 사령관, 개인 채널에서는 {{miraPersonal}}으로 구분하겠습니다.","mode":"mira"},{"speaker":"기억 파편 02","label":"CONFLICTING RECORD","text":"동일 등록명 확인. 명령 서명은 유효. 단, 타임스탬프와 발화 순서가 원본 기록과 일치하지 않습니다.","mode":"archive-voice"},{"speaker":"{{playerName}}","speakerRole":"commander","label":"RELAY // NAMED","text":"이름이 맞는 것과 기록이 진실인 건 별개야. 세 파편을 모두 회수하고, 누가 순서를 바꿨는지 확인한다.","mode":"first"},{"speaker":"기지 시스템","label":"HOSTILE SIGNAL","text":"격리 구역 침입 감지. 기억 잔향체 및 모방형 널폼 기동. 미회수 기억 파편 3개.","mode":"alert"},{"speaker":"미라 보스","label":"FIELD LINK // MIRA","text":"사격과 파편 원본 보호는 제가 맡겠습니다. 사령관은 편집 흔적과 철수선을 확인해 주십시오.","mode":"mira-ready"},{"speaker":"{{playerName}}","speakerRole":"commander","label":"RELAY // LIMITED COMMAND","text":"목표는 세 개의 기억 파편 회수. 계산값이 사람을 지우면 계산을 버려. 직접 확인한 위험부터 끊는다.","mode":"first"},{"speaker":"서술","label":"OPERATION LINK READY","title":"P-04 전투 준비","text":"격리 구역에서 기억 파편 3개를 회수하십시오. 이름은 복구됐지만, 과거 명령의 진위와 현재 인격의 연속성은 아직 확정되지 않았습니다.","mode":"chapter-end"}];
    const NAME_KEY="aftersignal:commander-name:v3";
    let volatileName="";
    const normalizeName=value=>String(value||"").replace(/[<>\u0000-\u001f\u007f]/g,"").replace(/\s+/g," ").trim().slice(0,12);
    function loadName(){try{return normalizeName(localStorage.getItem(NAME_KEY))}catch{return volatileName}}
    function saveName(value){const clean=normalizeName(value);volatileName=clean;try{localStorage.setItem(NAME_KEY,clean)}catch{}return clean}
    const addressBook={
      mira:{tactical:()=>"사령관",personal:name=>name?name+" 사령관":"사령관"},
      haneul7:{tactical:()=>"지휘관",personal:name=>name||"지휘관"},
      sera:{tactical:()=>"사령관",personal:name=>name||"기억상실"},
      yujin:{tactical:()=>"사령관님",personal:name=>name?name+" 님":"사령관님"},
      somi:{tactical:()=>"사령관",personal:name=>name?name+" 씨":"사령관"},
      bomin:{tactical:()=>"지휘관",personal:name=>name||"지휘관"}
    };
    function format(value){const name=loadName()||"사령관";return String(value||"").replaceAll("{{playerName}}",name).replaceAll("{{miraPersonal}}",addressBook.mira.personal(loadName()))}
    Object.assign(scenes[0],{label:"TRANSIT // AFTER CONSENT",text:"과전류 포탑의 전력 경로를 우회하고 강제 접속 장치를 정지시킨다. 미라의 동의를 확인한 현재 채널 하나만 안정 링크를 유지한다."});
    const story=document.getElementById("story"),dialogue=document.getElementById("dialogue"),speaker=document.getElementById("speaker"),label=document.getElementById("label"),line=document.getElementById("line"),chapterTitle=document.getElementById("chapterTitle"),progress=document.getElementById("progress");
    const nameGate=document.getElementById("nameGate"),nameForm=document.getElementById("nameForm"),nameInput=document.getElementById("playerNameInput"),nameError=document.getElementById("nameError"),nameConfirm=document.getElementById("nameConfirm");
    let index=0,auto=false,timer=0,hidden=false,nameGateMode="story";
    function openNameGate(mode="edit"){nameGateMode=mode;const saved=loadName();nameInput.value=saved;validateName();nameGate.classList.add("show");setTimeout(()=>nameInput.focus(),80)}
    function closeNameGate(){nameGate.classList.remove("show");dialogue.focus()}
    function validateName(){const clean=normalizeName(nameInput.value);const valid=clean.length>=1&&/^[\p{L}\p{N} ._'-]+$/u.test(clean);nameConfirm.disabled=!valid;nameError.textContent=nameInput.value&&!valid?"한글·영문·숫자와 일부 구분 기호만 사용할 수 있습니다.":"";return valid}
    function render(nextIndex,instant=false){index=Math.max(0,Math.min(scenes.length-1,nextIndex));const scene=scenes[index];if(!instant)dialogue.classList.add("changing");clearTimeout(timer);setTimeout(()=>{story.dataset.mode=scene.mode;speaker.textContent=scene.speakerRole==="commander"?(loadName()||"사령관"):format(scene.speaker);dialogue.toggleAttribute("data-af-narration",scene.speaker==="서술"&&!/^chapter/.test(scene.mode));label.textContent=format(scene.label);line.textContent=format(scene.text);chapterTitle.textContent=format(scene.title||"");progress.style.width=((index+1)/scenes.length*100)+"%";dialogue.classList.remove("changing");if(scene.requiresName&&!loadName())setTimeout(()=>openNameGate("story"),260);scheduleAuto()},instant?0:120)}
    function next(){if(nameGate.classList.contains("show"))return;if(index<scenes.length-1)render(index+1)}
    function scheduleAuto(){clearTimeout(timer);if(!auto||index>=scenes.length-1||nameGate.classList.contains("show"))return;timer=setTimeout(next,Math.max(Math.min(9000,2300+format(scenes[index].text).length*66),window.AfterSignalStoryVoice?.holdMs()||0))}
    nameInput.addEventListener("input",validateName);
    nameForm.addEventListener("submit",event=>{event.preventDefault();if(!validateName())return;const name=saveName(nameInput.value);nameInput.value=name;closeNameGate();if(nameGateMode==="story"&&scenes[index].requiresName)render(index+1);else render(index,true)});
    dialogue.addEventListener("click",event=>{if(!event.target.closest("button"))next()});dialogue.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();next()}});
    document.addEventListener("keydown",event=>{if(nameGate.classList.contains("show"))return;if(event.key===" "||event.key==="Enter"||event.key==="ArrowRight"){event.preventDefault();next()}if(event.key.toLowerCase()==="a")document.getElementById("autoButton").click();if(event.key.toLowerCase()==="n")openNameGate("edit")});
    document.getElementById("autoButton").addEventListener("click",function(){auto=!auto;this.textContent=auto?"● AUTO":"AUTO";scheduleAuto()});
    document.getElementById("hideButton").addEventListener("click",function(){hidden=!hidden;dialogue.style.visibility=hidden?"hidden":"visible";this.textContent=hidden?"◩ SHOW":"HIDE"});
    document.getElementById("logButton").addEventListener("click",()=>window.alert(scenes.slice(0,index+1).map(item=>(item.speaker==="서술"?"":(item.speakerRole==="commander"?(loadName()||"사령관"):format(item.speaker))+" | ")+format(item.text)).join("\n\n")));
    document.getElementById("skipButton").addEventListener("click",()=>render(scenes.length-1));
    document.getElementById("nameButton").addEventListener("click",()=>openNameGate("edit"));
    document.getElementById("endAction").addEventListener("click",function(){if(window.parent!==window){window.parent.postMessage({type:"aftersignal:navigate",screen:"p04combat"},"*")}else{window.location.href="../../battle/P04/AFTERSIGNAL_P04_COMBAT_V0_31_STANDALONE.html"}});
    render(0,true);
  </script>
<script>
(() => {

  const unlock = () => {
    if (sent) return;
    sent = true;
    window.parent.postMessage({ type: "aftersignal:audio-unlock" }, "*");
  };
  window.addEventListener("pointerdown", unlock, { passive: true });
  window.addEventListener("keydown", unlock);
  const result = document.getElementById("resultOverlay");
  if (result) new MutationObserver(() => {
    const won = !result.classList.contains("hidden") && (document.getElementById("resultText")?.textContent || "").includes("3/3 회수 완료");

})();
</script>
<script data-af-story-controls="8aeedc011a23ade1fe983ac06dd40c5692539d7cfc4edc04d684185a5f228f90">(()=>{
  "use strict";
  const specs={
    hide:{ids:["hide","hideButton"],label:"HIDE",key:"H",code:"KeyH"},
    auto:{ids:["auto","autoButton"],label:"AUTO",key:"A",code:"KeyA"},
    // Some early story pages use #log for the panel and #logButton for the

    log:{ids:["logButton","log"],label:"LOG",key:"L",code:"KeyL"},
    skip:{ids:["skip","skipButton"],label:"SKIP",key:"S",code:"KeyS"},
    sound:{ids:["sound","soundButton","bgmButton"],label:"BGM",key:"M",code:"KeyM"}
  };
  const find=spec=>{
    const candidates=spec.ids.map(id=>document.getElementById(id)).filter(Boolean);
    return candidates.find(node=>node.tagName==="BUTTON")||candidates[0];
  };
  const render=(button,action,spec)=>{
    if(!button)return;
    button.dataset.afStoryAction=action;
    button.classList.add("af-story-control");
    button.innerHTML=`<span>${spec.label}</span><kbd aria-hidden="true">${spec.key}</kbd>`;
    button.setAttribute("aria-keyshortcuts",spec.key);
  };
  const normalize=()=>{
    const controls=Object.entries(specs).map(([action,spec])=>[action,spec,find(spec)]).filter(([,spec,node])=>node&&spec.label!=="BGM");
    const nav=controls[0]?.[2]?.closest("nav,.story-head,.controls,.top-actions,.story-controls")||controls[0]?.[2]?.parentElement;
    if(!nav)return false;
    nav.classList.add("af-story-controls");
    controls.forEach(([action,spec,node])=>{if(node.parentElement!==nav)nav.append(node);render(node,action,spec)});
    const sound=find(specs.sound);if(sound){sound.dataset.afStoryAction="sound";sound.classList.add("af-story-control")}
    return true;
  };
  normalize();
  document.addEventListener("keydown",event=>{
    if(event.repeat||event.altKey||event.ctrlKey||event.metaKey)return;
    const target=event.target;if(target?.matches?.("input,textarea,select,[contenteditable=true]"))return;
    const entry=Object.entries(specs).find(([,spec])=>spec.code===event.code);if(!entry)return;
    const button=find(entry[1]);if(!button||button.disabled)return;
    // P-00 already owns a window-level shortcut listener. Stop this event at
    // document so one physical key press cannot toggle the action twice.
    event.preventDefault();event.stopPropagation();button.click();
  });
  window.AfterSignalStoryControls=Object.freeze({version:"1.1",normalize,specs});
})();
</script><script data-af-stage-flow-story="1.0">(()=>{const screen="p04",flow=window.AfterSignalStageFlow;if(!flow)return;const legacyNext=typeof window.next==="function"?window.next:null;if(legacyNext)window.next=function(){try{if(typeof index!=="undefined"&&typeof SCENES!=="undefined"&&index>=SCENES.length-1)return flow.continueFrom(screen)}catch{}return legacyNext.apply(this,arguments)};for(const id of ["endAction","enterBattle"]){const node=document.getElementById(id);node?.addEventListener("click",event=>{event.preventDefault();event.stopImmediatePropagation();flow.continueFrom(screen)},{capture:true})}})();</script><script src="../shared/story-ui/AFTERSIGNAL_STORY_VOICE_V1.js?build=20260929vl1" data-af-story-voice="p04"></script></body>
