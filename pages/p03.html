<body>
  <main id="story" class="story" data-mode="chapter-open" aria-label="AFTERSIGNAL P-03 다섯 개의 빈자리">

  <script>
    const scenes = [{"speaker":"서술","label":"P-02 // AFTER ACTION","text":"마지막 신호 기생체가 꺼지자 보관실의 경보음도 한 박자 늦게 멎는다. 미라의 프레임을 훑던 청록색 정착선이 마침내 안정된 파형으로 바뀐다.","mode":"wide"},{"speaker":"미라 보스","label":"FRAME STATUS // STABLE","text":"정착 완료. 이제 제 이름만큼은 확신할 수 있습니다. 미라 보스입니다.","mode":"mira-close"},{"speaker":"사령관","label":"RELAY // UNKNOWN ID","text":"그리고 내 이름은?","mode":"first"},{"speaker":"미라 보스","label":"FIELD LINK // MIRA","text":"제가 알고 있는 이름이 당신의 것인지 아직 확인할 수 없습니다. 생체 키는 일치하지만, 현재의 당신과 과거 기록이 같은 인격이라는 증거는 아닙니다.","mode":"mira-dim"},{"speaker":"사령관","label":"RELAY // UNKNOWN ID","text":"그럼 모른다고 말해. 빈자리를 그럴듯한 답으로 채우는 것보다 낫지.","mode":"first"},{"speaker":"미라 보스","label":"FIELD LINK // MIRA","text":"……모르겠습니다. 하지만 당신을 두고 가지는 않겠습니다. 적어도 그 선택은 지금의 제 것입니다.","mode":"mira"},{"speaker":"서술","label":"TRANSIT // NO SIGNAL WATCH","text":"미라는 동기화실로 이어지는 폐쇄 관측로를 가리킨다. 끊어진 도시의 불빛 너머로 다섯 개 좌석을 뜻하는 표식이 하나씩 떠오른다.","mode":"archive"},{"speaker":"서술","label":"PROLOGUE // P-03","title":"다섯 개의 빈자리","text":"폐쇄 릴레이 기지 R-0 「루멘」. 신호가 닿지 않는 감시실에서 오래된 편성 시스템이 다시 호흡을 시작한다.","mode":"chapter-open"},{"speaker":"기지 시스템","label":"FORMATION CORE // RECOVERY","text":"생체 키 1건 인식. 미등록 신호의 전술 접속은 허용하지 않습니다.","mode":"system"},{"speaker":"서술","label":"SYNCHRONIZATION ROOM","text":"비활성 접속 단자에는 오래된 손자국이 남아 있다. 손목 고정부와 신경 접속부 주변에는 스스로 빠져나오려 한 듯한 강제 연결 흔적이 검게 타 있다.","mode":"archive"},{"speaker":"미라 보스","label":"ARCHIVE ANALYSIS // MIRA","text":"이 장치는 다섯 사람의 감각과 판단을 하나의 지휘 계통으로 묶었습니다. 기록상 최종 승인에는 당신과 일치하는 생체 키가 사용됐습니다.","mode":"mira"},{"speaker":"사령관","label":"RELAY // UNKNOWN ID","text":"기억이 없는 지금의 내가 그 권한을 이어받는다면, 과거의 책임까지 자동으로 내 것이 되는 건가?","mode":"first"},{"speaker":"미라 보스","label":"FIELD LINK // MIRA","text":"증명할 수 없습니다. 다만 시스템은 지금도 당신의 키를 명령권자로 받아들입니다.","mode":"mira-dim"},{"speaker":"사령관","label":"RELAY // LIMITED COMMAND","text":"그렇다면 첫 명령은 분명히 하자. 동시 강제 동기화는 금지한다. 좌석은 하나씩, 당사자가 정보와 철수 조건을 확인하고 동의했을 때만 연다.","mode":"first"},{"speaker":"미라 보스","label":"PROTOCOL CONFLICT","text":"구 프로토콜은 전투 효율을 우선합니다. 현재 명령은 기존 지휘 규약과 충돌합니다.","mode":"mira-close"},{"speaker":"사령관","label":"RELAY // NEW STANDARD","text":"그 충돌도 원본 그대로 남겨. 자리가 다섯 개라는 이유로 누구도 명령의 부품이 되어선 안 돼.","mode":"first"},{"speaker":"기지 시스템","label":"HOSTILE REACTION","text":"순차 활성화 요청 감지. 구 프로토콜 방어 반응으로 과전류 포탑 기동. 좌석 전력 경로가 차단되었습니다.","mode":"alert"},{"speaker":"미라 보스","label":"FIELD LINK // MIRA","text":"포탑 전력 경로를 우회하겠습니다. 가공하지 않은 센서 원본도 함께 연결하겠습니다. 이상이 보이면 즉시 철수시켜 주세요.","mode":"mira-ready"},{"speaker":"사령관","label":"RELAY // LIMITED COMMAND","text":"우회와 현장 선택은 미라가 맡아. 나는 활성화 순서와 철수선만 감시한다. 네 판단을 강제로 덮어쓰지 않겠다.","mode":"first"},{"speaker":"미라 보스","label":"FIELD LINK // ACCEPTED","text":"확인. 현재의 합의를 새 기준으로 기록합니다. 첫 번째 좌석, 미라 보스가 자발적으로 접속합니다.","mode":"mira-close"},{"speaker":"서술","label":"OPERATION LINK READY","title":"P-03 전투 준비","text":"동기화 좌석 5개를 순차 활성화하십시오. 현재 출전자는 미라 보스 한 명이며, 나머지 네 좌석은 소유자의 동의가 확인될 때까지 비워 둡니다.","mode":"chapter-end"}];
    Object.assign(scenes[scenes.length-1],{label:"NEXT SIGNAL // P-04",title:"남겨진 발자국",text:"첫 번째 좌석의 자발적 접속 기록을 보존한 뒤, 끊어진 신호가 남긴 발자국을 따라 다음 관측 구역으로 이동합니다."});
    const story=document.getElementById("story"),dialogue=document.getElementById("dialogue"),speaker=document.getElementById("speaker"),label=document.getElementById("label"),line=document.getElementById("line"),chapterTitle=document.getElementById("chapterTitle"),progress=document.getElementById("progress");
    let index=0,auto=false,timer=0,hidden=false;
    function render(nextIndex,instant=false){index=Math.max(0,Math.min(scenes.length-1,nextIndex));const scene=scenes[index];if(!instant)dialogue.classList.add("changing");clearTimeout(timer);setTimeout(()=>{story.dataset.mode=scene.mode;speaker.textContent=scene.speaker;dialogue.toggleAttribute("data-af-narration",scene.speaker==="서술"&&!/^chapter/.test(scene.mode));label.textContent=scene.label;line.textContent=scene.text;chapterTitle.textContent=scene.title||"";progress.style.width=((index+1)/scenes.length*100)+"%";dialogue.classList.remove("changing");scheduleAuto()},instant?0:120)}
    function next(){if(index<scenes.length-1)render(index+1)}
