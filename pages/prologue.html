    <section id="opening" class="opening"><div class="opening-card"><small>RELAY MEMORY // ENTRY 01</small><h1>차가운 기동</h1><p>폐쇄 릴레이 기지 R-0 「루멘」.<br>기억 없이 깨어난 사령관의 첫 기록을 재생합니다.</p><button id="begin" type="button">기록 재생</button></div></section>

  <script>
    const scenes=[
      {speaker:'기록',role:'narration',text:'폐쇄 릴레이 기지 R-0 「루멘」. 결빙된 배관에서 하얀 수증기가 새고, 비상등은 심장 박동보다 늦게 켜진다. 성에 낀 생체 캡슐 하나가 뒤늦게 열린다.'},
      {speaker:'기록',role:'narration',text:'사령관이 생체 캡슐에서 깨어난다. 자신의 이름도, 이곳에 온 이유도 설명할 기억은 남아 있지 않다.'},
      {speaker:'사령관',role:'command',text:'…여긴 어디지? 내가 누구였는지조차 기억나지 않아.'},
      {speaker:'미라 보스',role:'mira',text:'의식 회복 확인. 호칭은 보류하겠습니다. 일어설 수 있습니까?'},
      {speaker:'사령관',role:'command',text:'몸은 움직여. 하지만 당신도, 나도 기억나지 않아.'},
      {speaker:'미라 보스',role:'mira',text:'그럼 지금은 생존자입니다. 현장 판단과 교전은 제가 맡겠습니다.'},
      {speaker:'기록',role:'narration',text:'미라는 사령관을 알아본 눈빛을 숨긴 채 모르는 사람처럼 거리를 둔다. 사령관은 그 짧은 망설임만 기억해 둔다.'},
      {speaker:'기록',role:'narration',text:'기지는 수십 년 전에 폐쇄됐다. 그러나 방금 수신된 구조 신호가 제어실을 반복 호출하고 있다.'},
      {speaker:'시설 시스템',role:'narration',text:'생체 권한 일치. 릴레이 지휘 권한을 복구합니다.'},
