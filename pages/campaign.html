<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02060a"><title>AFTER SIGNAL — 메인 스토리 작전 지도</title><style>
/* CAMPAIGN_CH01_05_V1 operation map (2026-09-27, Claude Code). Chapter tabs, 20 stage nodes per chapter,
   stage briefing (enemies, formation, first-clear rewards) and sortie. Background = the chapter's PASS 4-layer strips. CAMPAIGN_CH06_15_V1 (2026-09-28): CH06+ chapters come from the extension data. */
@font-face{font-family:CombatKR;src:url("../assets/fa6767788359138e7825.woff2") format("woff2");font-weight:700 900;font-display:swap}@font-face{font-family:RelayDisplay;src:url("../assets/5b7e4a6f97163c263672.woff2") format("woff2");font-weight:700;font-display:swap}
:root{--cyan:#75eff2;--violet:#d69aff;--gold:#ffc775;--line:rgba(120,234,242,.34)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02060a;color:#effbff;font-family:CombatKR,"Noto Sans KR",sans-serif}
button{font-family:inherit}
.map{position:relative;width:100%;height:100svh;overflow:hidden}
.bgwrap{position:absolute;inset:0;overflow:hidden;filter:saturate(.7) brightness(.42) blur(1px)}.bgstrip{position:absolute;top:0;height:100%;display:flex;flex-direction:column}.bgstrip img{display:block;width:100%;height:25%;object-fit:fill}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,6,12,.2),rgba(2,6,12,.05) 45%,rgba(2,6,12,.72) 72%),linear-gradient(0deg,rgba(2,6,12,.85),transparent 40%)}
.head{position:absolute;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;gap:16px;padding:max(14px,env(safe-area-inset-top)) 3.2% 10px}
.back{border:1px solid rgba(235,241,249,.5);background:rgba(4,12,20,.6);color:#fff;padding:8px 14px;font:800 13px CombatKR;cursor:pointer}
.head .title{padding-left:12px;border-left:3px solid var(--cyan);font:700 12px/1.3 RelayDisplay;letter-spacing:.18em;color:#bff7fb}.head .title b{display:block;font:900 22px/1.1 CombatKR;letter-spacing:-.04em;color:#fff}
.tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:nowrap;justify-content:flex-start;max-width:calc(100% - 250px);overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;padding-bottom:2px}.tab{flex:0 0 auto;min-width:64px;padding:8px 12px;border:1px solid var(--line);background:rgba(3,14,22,.7);color:#cfe9ee;font:800 12px/1.1 RelayDisplay;letter-spacing:.1em;cursor:pointer;text-align:left}.tab small{display:block;margin-top:3px;font:700 10px CombatKR;letter-spacing:0;color:#8fb4bb}.tab.on{border-color:var(--cyan);background:rgba(8,49,59,.85);color:#fff}.tab.locked{opacity:.45;cursor:not-allowed}
.chapter-head{position:absolute;z-index:4;left:3.2%;top:84px;max-width:58%}.chapter-head small{font:700 12px RelayDisplay;letter-spacing:.2em;color:var(--cyan)}.chapter-head h1{margin:6px 0 4px;font:900 clamp(24px,2.6vw,38px)/1.1 CombatKR;letter-spacing:-.05em;text-shadow:0 3px 10px #000}.chapter-head p{margin:0;color:#b9d3d8;font:600 14px/1.5 CombatKR;text-shadow:0 2px 6px #000}.chapter-head .bar{margin-top:10px;width:260px;height:5px;background:rgba(255,255,255,.12)}.chapter-head .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet))}
.nodes{position:absolute;z-index:4;left:3.2%;right:37%;top:200px;bottom:4%;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:minmax(64px,1fr);gap:10px 12px;align-content:start}
.node{position:relative;display:flex;flex-direction:column;justify-content:center;min-height:64px;padding:8px 10px 8px 12px;border:1px solid var(--line);border-left:3px solid rgba(120,234,242,.5);background:rgba(3,13,21,.78);color:#e9f8fb;text-align:left;cursor:pointer;transition:transform .15s,border-color .15s}
.node b{font:800 12px/1 RelayDisplay;letter-spacing:.1em;color:#9ceaf1}.node span{margin-top:5px;font:800 13px/1.25 CombatKR;letter-spacing:-.03em;word-break:keep-all;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.node.clear{border-left-color:#86f0b4}.node.clear:after{content:"CLEAR";position:absolute;right:8px;top:7px;font:700 9px RelayDisplay;letter-spacing:.14em;color:#86f0b4}
.node.current{border-color:var(--gold);border-left-color:var(--gold);box-shadow:0 0 0 1px rgba(255,199,117,.35),0 0 18px rgba(255,199,117,.25)}.node.current:after{content:"NEW";position:absolute;right:8px;top:7px;font:700 9px RelayDisplay;letter-spacing:.14em;color:var(--gold)}
.node.locked{opacity:.38;cursor:not-allowed}.node.boss{background:rgba(24,8,32,.8);border-left-color:var(--violet)}.node.boss b{color:#e3b6ff}.node.sel{transform:translateY(-2px);border-color:#fff;background:rgba(10,40,52,.92)}
.panel{position:absolute;z-index:6;right:2.6%;top:84px;bottom:4%;width:33%;display:flex;flex-direction:column;padding:18px 20px;border-top:1px solid rgba(120,234,242,.72);border-bottom:1px solid rgba(202,155,255,.58);background:rgba(2,10,18,.9);overflow:auto}
.panel small.k{font:700 11px RelayDisplay;letter-spacing:.2em;color:var(--cyan)}.panel h2{margin:6px 0 2px;font:900 clamp(22px,2.2vw,32px)/1.1 CombatKR;letter-spacing:-.05em;word-break:keep-all}.panel .type{display:inline-block;margin-top:4px;padding:3px 8px;border:1px solid var(--line);font:800 11px CombatKR;color:#cfe9ee}.panel .type.boss{border-color:rgba(214,154,255,.7);color:#e9c7ff}
.sec{margin-top:16px}.sec>small{display:block;margin-bottom:8px;font:700 11px RelayDisplay;letter-spacing:.16em;color:#8fb4bb}
.foes{display:flex;gap:8px;flex-wrap:wrap}.foe{width:92px;text-align:center}.foe div{height:86px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.1);background:radial-gradient(circle at 50% 60%,rgba(120,40,60,.35),rgba(4,10,16,.6))}.foe img{max-width:88px;max-height:82px;object-fit:contain}.foe span{display:block;margin-top:4px;font:700 11px/1.3 CombatKR;color:#d8e8eb;word-break:keep-all}.foe.boss{width:124px}.foe.boss div{height:112px;background:radial-gradient(circle at 50% 60%,rgba(120,50,170,.45),rgba(4,10,16,.6))}.foe.boss img{max-width:120px;max-height:108px}
.party{display:flex;flex-wrap:wrap;gap:6px}.party span{padding:5px 9px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);font:700 12px CombatKR}.party em{display:block;margin-top:6px;font:600 11px/1.4 CombatKR;font-style:normal;color:#8fb4bb}
.rewards{display:flex;flex-wrap:wrap;gap:6px}.rewards span{padding:5px 9px;border:1px solid rgba(255,255,255,.12);font:700 12px CombatKR;color:#e8f4f6}.rewards .gem{border-color:rgba(205,184,255,.6);color:#e4d8ff}
.actions{position:sticky;bottom:-18px;margin-top:auto;padding:16px 0 18px;display:flex;gap:8px;background:linear-gradient(transparent,rgba(2,10,18,.96) 26%)}.go{flex:1;padding:14px 12px;border:1px solid var(--cyan);background:#07313b;color:#fff;font:900 16px CombatKR;cursor:pointer}.go.alt{flex:.7;border-color:rgba(235,241,249,.45);background:rgba(8,20,30,.8);font-size:14px}.go:disabled{opacity:.4;cursor:not-allowed}
.locknote{margin-top:10px;color:#ffc775;font:700 12px/1.5 CombatKR}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;z-index:9;background:rgba(2,6,10,.8)}.empty div{max-width:520px;padding:24px;border-top:1px solid var(--cyan);border-bottom:1px solid var(--violet);background:#04111c}
@media(max-aspect-ratio:1/1){.head{flex-wrap:wrap}.tabs{margin-left:0;width:100%;max-width:none;justify-content:flex-start;flex-wrap:nowrap;gap:4px}.tab{min-width:56px;flex:0 0 auto;padding:6px 5px;font-size:11px;text-align:center}.tab small{font-size:9px;white-space:nowrap;overflow:hidden}.chapter-head{top:124px;max-width:94%}.chapter-head small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chapter-head h1{font-size:24px}.nodes{top:226px;right:3.2%;bottom:calc(44% + 62px);grid-template-columns:repeat(4,1fr);overflow:auto;grid-auto-rows:58px}.node span{font-size:12px}.panel{left:3.2%;right:3.2%;width:auto;top:auto;height:44%;bottom:60px;padding:14px 16px 0}.panel .actions{position:sticky;bottom:0;margin-top:auto;padding:10px 0 12px;background:linear-gradient(transparent,rgba(2,10,18,.96) 30%)}.foe{width:74px}.foe div{height:66px}.foe img{max-width:70px;max-height:62px}.foe.boss{width:96px}.foe.boss div{height:84px}.foe.boss img{max-width:92px;max-height:80px}}
@media(max-height:560px) and (min-aspect-ratio:1/1){.chapter-head{top:64px}.chapter-head p{display:none}.nodes{top:132px;bottom:56px;overflow:auto;grid-auto-rows:minmax(48px,1fr);gap:6px 8px}.node{min-height:48px;padding:5px 8px}.node span{font-size:11px}.panel{top:64px;padding:12px 14px}.actions{bottom:-12px;padding:10px 0 12px}.go{padding:10px 12px}.foe div{height:60px}.foe img{max-height:56px}.foe.boss div{height:76px}.foe.boss img{max-height:72px}}
</style><script src="../shared/progression/AFTERSIGNAL_DIAMOND_ECONOMY_V1.js?build=20261002deploy1"></script><script src="../shared/shelter/AFTERSIGNAL_SHELTER_V1.js?build=20261002deploy1"></script><script src="../shared/gacha/AFTERSIGNAL_GACHA_V1.js?build=20261002deploy1"></script><script src="../shared/campaign/AFTERSIGNAL_CAMPAIGN_DATA_CH01_05.js?build=20261002deploy1"></script><script src="../shared/campaign/AFTERSIGNAL_CAMPAIGN_DATA_CH06_15.js?build=20261002deploy1"></script><script src="../shared/campaign/AFTERSIGNAL_CAMPAIGN_V1.js?build=20261002deploy1"></script></head><body data-af-campaign-map="v1"><main class="map" id="map">
<div class="bgwrap"><div id="bgstrip" class="bgstrip"></div></div><div class="shade"></div>
<header class="head"><button class="back" id="back" type="button">‹ 거점</button><div class="title">MAIN STORY<b>메인 작전</b></div><nav class="tabs" id="tabs"></nav></header>
<section class="chapter-head" id="chapterHead"></section><section class="nodes" id="nodes"></section><aside class="panel" id="panel"></aside></main>
<script>(()=>{
"use strict";
const C=window.AfterSignalCampaign,E=window.AfterSignalDiamondEconomy,$=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const fmt=n=>Number(n||0).toLocaleString("ko-KR"),profile=C.profile(),frontier=C.frontier(profile),launch=C.readLaunch();
const chapters=[...C.chapters.values()];
let selected=(launch&&C.isUnlocked(launch.stageId,profile)?launch.stageId:null)||frontier||C.order[C.order.length-1];
let chapterId=C.byId.get(selected).chapter;
const typeLabel=s=>s.type==="CHAPTER_BOSS"?"장 보스":s.type==="MIDBOSS"?"중간보스":"일반 작전";
function background(){const chapter=C.chapters.get(chapterId),set=chapter.backgrounds[0],strip=$("bgstrip");strip.innerHTML=set.layers.map(l=>`<img src="${l.source}" alt="">`).join("");const vh=innerHeight,w=vh*3.2;strip.style.width=w+"px";strip.style.left=((innerWidth-w)/2)+"px";}
/* CAMPAIGN_CH06_15_V1: chapters without data yet stay listed as one "준비 중" tab; the chapter boss stage decides "완료" */const LAST_CHAPTER=15,soonTab=()=>{const next=Math.max(0,...chapters.map(ch=>ch.no))+1;return next>LAST_CHAPTER?"":`<button class="tab locked" type="button" disabled>CH ${String(next).padStart(2,"0")}${next<LAST_CHAPTER?`~${LAST_CHAPTER}`:""}<small>준비 중</small></button>`;};function tabs(){$("tabs").innerHTML=chapters.map(ch=>{const open=C.isUnlocked(`${ch.id}-01`,profile),done=ch.bosses&&C.isCleared(C.bossStageOf?.(ch.id)||`${ch.id}-20`,profile);return`<button class="tab${ch.id===chapterId?" on":""}${open?"":" locked"}" data-ch="${ch.id}" type="button">${ch.id.replace("CH","CH ")}<small>${done?"완료":open?"진행 중":"잠김"}</small></button>`}).join("")+soonTab();{const bar=$("tabs"),on=bar.querySelector(".tab.on");if(on)bar.scrollLeft=Math.max(0,on.offsetLeft-bar.offsetLeft-(bar.clientWidth-on.offsetWidth)/2);}
  $("tabs").querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{if(b.classList.contains("locked"))return;chapterId=b.dataset.ch;const ids=C.stages.filter(s=>s.chapter===chapterId).map(s=>s.id);selected=ids.find(id=>id===frontier)||ids.filter(id=>C.isUnlocked(id,profile)).pop()||ids[0];render();});}
function head(){const chapter=C.chapters.get(chapterId),ids=C.stages.filter(s=>s.chapter===chapterId),done=ids.filter(s=>C.isCleared(s.id,profile)).length;$("chapterHead").innerHTML=`<small>CHAPTER ${String(chapter.no).padStart(2,"0")} · ${esc(chapter.region)}</small><h1>${esc(chapter.title)}</h1><p>진행 ${done} / ${ids.length}</p><div class="bar"><i style="width:${done/ids.length*100}%"></i></div>`;}
function nodes(){const ids=C.stages.filter(s=>s.chapter===chapterId);$("nodes").innerHTML=ids.map(s=>{const open=C.isUnlocked(s.id,profile),clear=C.isCleared(s.id,profile);return`<button type="button" class="node${s.type!=="NORMAL"?" boss":""}${clear?" clear":""}${s.id===frontier?" current":""}${open?"":" locked"}${s.id===selected?" sel":""}" data-id="${s.id}"><b>${esc(s.code)}${s.type==="CHAPTER_BOSS"?" · BOSS":s.type==="MIDBOSS"?" · MID":""}</b><span>${esc(s.title)}</span></button>`}).join("");
  $("nodes").querySelectorAll(".node").forEach(n=>n.onclick=()=>{if(n.classList.contains("locked"))return;selected=n.dataset.id;render();});}
function panel(){const s=C.byId.get(selected),open=C.isUnlocked(s.id,profile),clear=C.isCleared(s.id,profile),mobs=s.mobs.map(id=>C.enemies.get(id)),boss=s.boss?C.enemies.get(s.boss):null,party=C.resolveParty(profile),actors=C.data.actors;
  const reward=s.reward,gem=clear?0:(E?.stageFirstClear?.(s.id)||0);
  const roster=window.AfterSignalShelter?.characters||{},partyNames=party.ids.map(id=>esc(roster[id]?.name||actors[id]?.name||id));
  $("panel").innerHTML=`<small class="k">${esc(s.code)} · ${esc(C.chapters.get(s.chapter).id)}</small><h2>${esc(s.title)}</h2><span class="type${s.type!=="NORMAL"?" boss":""}">${typeLabel(s)}${clear?" · 클리어":""}</span>
  <div class="sec"><small>ENEMY // 출현 적</small><div class="foes">${boss?`<div class="foe boss"><div><img src="${boss.asset}" alt=""></div><span>${esc(boss.name)}</span></div>`:""}${mobs.map(m=>`<div class="foe"><div><img src="${m.asset}" alt=""></div><span>${esc(m.name)}</span></div>`).join("")}</div></div>
  <div class="sec"><small>SQUAD // 출격 편성</small><div class="party">${partyNames.map(n=>`<span>${n}</span>`).join("")}</div><div class="party"><em>${party.source==="guest"?"보유 대원이 없어 스토리 게스트 분대가 출격합니다. 대원 모집 후 거점 › 출격 편성에서 바꿀 수 있습니다.":"거점 › 출격 편성의 대원이 출격합니다."}</em></div></div>
  <div class="sec"><small>REWARD // ${clear?"재완료 보상":"첫 완료 보상"}</small><div class="rewards">${gem?`<span class="gem">다이아 +${fmt(gem)}</span>`:""}<span>골드 +${fmt(clear?Math.round(reward.credits*.3/10)*10:reward.credits)}</span><span>사령관 EXP +${fmt(clear?Math.round(reward.commanderXp*.3):reward.commanderXp)}</span><span>전투 기록 +${fmt(clear?Math.round(reward.battleData*.3/10)*10:reward.battleData)}</span>${clear?"":`${reward.coreSignal?`<span>코어 신호 +${reward.coreSignal}</span>`:""}<span>무기 모듈 +${reward.weaponModules}</span>`}</div></div>
  ${open?"":`<div class="locknote">이전 작전을 완료하면 개방됩니다.</div>`}
  <div class="actions">${clear?`${s.hasIntro===false&&!s.hasOutro?"":`<button class="go alt" id="story" type="button">스토리 다시 보기</button>`}<button class="go" id="fight" type="button">재출격</button>`:`<button class="go" id="sortie" type="button"${open?"":" disabled"}>출격</button>`}</div>`;
  $("sortie")&&($("sortie").onclick=()=>C.launch(s.id,"intro"));$("story")&&($("story").onclick=()=>C.launch(s.id,s.hasIntro===false&&s.hasOutro?"outro":"intro"));$("fight")&&($("fight").onclick=()=>C.launch(s.id,"combat"));}
function render(){background();tabs();head();nodes();panel();C.bgm(C.chapters.get(chapterId).bgm[0]);document.body.dataset.afCampaignSelected=selected;}
$("back").onclick=()=>C.navigate("lobby");
addEventListener("resize",background);
if(!C.prologueDone(profile)){document.getElementById("map").insertAdjacentHTML("beforeend",`<div class="empty"><div><h2>프롤로그 완료 후 개방</h2><p>P-14 작전을 완료하면 메인 작전 지도가 열립니다.</p><button class="go" type="button" onclick="AfterSignalCampaign.navigate('lobby')">거점으로</button></div></div>`);}
render();
window.__AF_CAMPAIGN_MAP__=Object.freeze({get selected(){return selected},render});
})();</script></body></html>
