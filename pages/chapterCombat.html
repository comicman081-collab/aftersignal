<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AFTER SIGNAL — 메인 작전 전투</title>
<style>

@font-face{font-family:CombatKR;src:url("../assets/fa6767788359138e7825.woff2") format("woff2")}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03060b;color:#effcff;font-family:CombatKR,system-ui,sans-serif}.app{height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 13%,#1d2a41 0,transparent 38%),#03060b}.viewport{position:relative;width:min(100vw,177.78vh);height:min(100vh,56.25vw);min-width:320px;min-height:180px;overflow:hidden;background:#07101b}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.top{position:absolute;z-index:3;inset:calc(14px + env(safe-area-inset-top)) 3% auto;display:flex;justify-content:space-between;gap:12px;pointer-events:none}.top>*{pointer-events:auto}.mission small,.mission b{display:block;text-align:center}.mission small{color:#ffc37a;font:700 11px/1 ui-monospace;letter-spacing:.14em}.mission b{margin-top:5px;font-size:20px}.control{padding:9px 12px;border:1px solid #9fe8f199;background:#081a22d9;color:#eaffff;border-radius:8px;font:700 11px CombatKR;cursor:pointer}
.feed{position:absolute;z-index:5;top:16%;left:3%;max-width:43%;padding:10px 13px;border-left:3px solid #75eff2;background:#04121ad0;color:#e9f6fa;font-size:14px;line-height:1.5;transition:opacity .3s}.feed.boss{border-left-color:#d786ff;background:#13091ad0}.feed b{color:#ffc975}.feed .who{color:#9ceaf1;font-weight:900}.feed .narr{color:#c9d8dc;font-style:italic}.feed.fade{opacity:.0}
.cutin{position:absolute;z-index:72;inset:0;display:none;place-items:center;background:linear-gradient(100deg,#08020bdd,#38152add,#090b1bdd)}.cutin.show{display:grid;animation:cut .8s ease both}.cutin img{position:absolute;left:4%;bottom:0;height:96%;width:46%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 0 35px #ff6fa2)}.cutin div{position:relative;align-self:start;justify-self:end;margin:17% 8% 0 0;max-width:45%;text-shadow:0 3px 8px #000}.cutin small{color:#ffd77e;font:700 13px ui-monospace;letter-spacing:.16em}.cutin b{display:block;margin-top:10px;font-size:clamp(28px,4vw,58px);letter-spacing:-.08em}.cutin span{display:block;margin-top:9px;color:#ffe8c9}
.result{position:absolute;z-index:70;inset:0;display:none;place-items:center;background:#000a}.result:not(.hidden){display:grid}.result>div{width:min(580px,86%);padding:26px;border-top:1px solid #8feaf4;border-bottom:1px solid #d6a5ff;background:#04111cf2;text-align:center}.result h1{margin:8px 0 12px;font-size:38px}.result button{margin-top:16px;padding:12px 24px;border:1px solid #8feaf4;background:#0b2530;color:#fff;font:900 15px CombatKR;cursor:pointer}@keyframes cut{0%{opacity:0;transform:scale(1.05)}18%,72%{opacity:1;transform:none}100%{opacity:0}}@media(max-aspect-ratio:4/5){.feed{top:13%;max-width:62%;font-size:11px}.mission b{font-size:15px}.control{font-size:9px}}
</style><script src="../shared/foundation/AFTERSIGNAL_FOUNDATION_V1.js?build=20260817motion120tick11"></script><script src="../shared/shelter/AFTERSIGNAL_SHELTER_V1.js?build=20260930shelter3"></script><script src="../shared/gacha/AFTERSIGNAL_GACHA_V1.js"></script><script src="../shared/campaign/AFTERSIGNAL_CAMPAIGN_DATA_CH01_05.js?build=20260930c2"></script><script src="../shared/campaign/AFTERSIGNAL_CAMPAIGN_DATA_CH06_15.js?build=20260929c9"></script><script src="../shared/campaign/AFTERSIGNAL_CAMPAIGN_V1.js?build=20260929c9"></script><script src="../shared/campaign/AFTERSIGNAL_CAMPAIGN_VOICE_CH01_05.js?build=20260929vl1"></script><script src="../shared/campaign/AFTERSIGNAL_CAMPAIGN_VOICE_CH06_15.js?build=20260929vl1"></script><script data-af-campaign-combat-pack="v1">(()=>{
  // Register the launched stage before the common runtime mounts (it mounts on window load). ?stage=CH01-07 opens a stage directly (QA).
  const C=window.AfterSignalCampaign,query=new URLSearchParams(location.search).get("stage");
  let launch=C.readLaunch();
  if(query&&C.byId.has(query))launch={stageId:query,phase:"combat",at:Date.now()};
  if(!launch)launch={stageId:C.frontier()||C.order[0],phase:"combat",at:Date.now()};
  const party=C.resolveParty();C.registerStage(launch.stageId,party.ids);
  window.__AF_CAMPAIGN_COMBAT__=Object.freeze({launch,party,stage:C.byId.get(launch.stageId)});
})();</script><script src="../shared/foundation/AFTERSIGNAL_PLATFORM_FOUNDATION_V1.js"></script><script src="../shared/foundation/AFTERSIGNAL_DESKTOP_QA_TOOLS_V1.js?build=20260817boundedbudget15"></script><script src="../shared/battle-ui/AFTERSIGNAL_ENEMY_LIVE2D_V1.js?build=20260929l2d6"></script><script src="../shared/battle-ui/AFTERSIGNAL_ENEMY_RIG_DATA_V1.js?build=20260929l2d6"></script><script src="../shared/foundation/AFTERSIGNAL_COMMON_COMBAT_RUNTIME_V1.js?build=20260817motion120tick11" data-af-common-combat-runtime="v1" data-af-common-runner-loader="v1"></script></head>
<body data-af-portrait-crop="head-shoulders" data-af-common-combat-runtime="v1" data-af-runtime="foundation-v1" data-af-campaign-combat="v1"><main class="app"><section class="viewport" id="viewport"><canvas id="game" width="1280" height="720" aria-label="메인 작전 전투"></canvas><header class="top"><button class="control" id="auto">AUTO FIRE: ON</button><div class="mission"><small id="missionLabel">CHAPTER</small><b id="missionTitle"></b></div><button class="control" id="ultimate">ULTIMATE [E]</button></header><aside class="feed" id="feed"></aside><section id="cutin" class="cutin" aria-hidden="true"><img alt="필살기 스탠딩 컷인"><div><small>INDEPENDENT CHANNEL</small><b>필살기</b><span>각자의 판단으로 중앙 코어를 노린다.</span></div></section><section id="result" class="result hidden"><div><small>OPERATION COMPLETE</small><h1>STAGE CLEAR</h1><p id="resultText">작전 목표를 확보했습니다.</p><button id="finishButton" type="button">작전 결과 확인</button></div></section></section></main>
<script data-af-campaign-combat-route="v1">(()=>{
  const C=window.AfterSignalCampaign,{launch,party,stage}=window.__AF_CAMPAIGN_COMBAT__,chapter=C.chapterOf(stage.id),$=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
  document.body.dataset.afStageId=stage.id;document.body.dataset.afDevParty=party.ids.join(",");document.body.dataset.afCampaignPartySource=party.source;C.bgm(stage.bgm);
  const typeText=stage.type==="CHAPTER_BOSS"?"CHAPTER BOSS":stage.type==="MIDBOSS"?"MIDBOSS":"OPERATION";
  $("missionLabel").textContent=`CHAPTER ${String(chapter.no).padStart(2,"0")} / ${typeText} / ${stage.code}`;$("missionTitle").textContent=stage.title;document.title=`AFTER SIGNAL — ${stage.code} ${stage.title}`;
  const feed=$("feed"),boss=stage.boss?C.enemies.get(stage.boss):null,commander=()=>{const n=localStorage.getItem("aftersignal:commander-name:v3")||"사령관";return n==="사령관"?n:n+" 사령관"};
  const nameOf=key=>key==="commander"?commander():String(key||"").startsWith("boss:")?(boss?.name||""):(C.data.actors[key]?.name||key);
  const show=(html,bossTone=false)=>{feed.classList.toggle("boss",bossTone);feed.innerHTML=html;};
  show(stage.type==="NORMAL"?`<b>ENGAGE // ${esc(stage.code)}</b><br>${stage.mobs.map(id=>esc(C.enemies.get(id).name)).join(" · ")} 섬멸`:`<b>${stage.type==="CHAPTER_BOSS"?"CHAPTER BOSS":"MIDBOSS"} // ${esc(boss.name)}</b><br>방어 파츠를 끊고 노출된 코어를 공격하십시오.`,stage.type!=="NORMAL");
  // boss phases: banner, then (chapter boss) the scenario's lines for that phase, one at a time
  let queue=[],timer=0;
  // CAMPAIGN_VOICE_V1 (2026-09-27): a boss-phase dialogue line plays its approved v2 recording and holds the feed until it ends
  // SORTIE_VOICE_V1 (2026-09-28): the leader's sortie call plays at battle start; hold the comm until it ends
  const pump=()=>{clearTimeout(timer);const hold=window.AfterSignalSortieVoice?.remainingMs?.()||0;if(hold>0&&queue.length){timer=setTimeout(pump,hold+400);return}const row=queue.shift();if(!row)return;const [kind,who,text,head]=row;show(`<b>${esc(head)}</b><br>${kind==="n"?`<span class="narr">${esc(text)}</span>`:`<span class="who">${esc(nameOf(who))}</span> ${esc(text)}`}`,true);const V=window.AfterSignalCampaignVoice,spoken=kind==="d"&&V?V.say(who,text,"chapterCombat"):null;timer=setTimeout(pump,kind==="n"?Math.min(5200,Math.max(2600,String(text).length*45)):Math.max(2600,String(text).length*62,spoken?spoken.ms+spoken.gap+300:0));};
  // A break/exposure phase only shows its banner: the current scenario phase's remaining lines continue after it
  // (a quick node break used to drop them). A new scenario phase replaces the queue with its own lines.
  addEventListener("aftersignal:boss-phase",event=>{const phase=stage.battle.boss?.phases?.find(p=>p.id===event.detail?.phaseId);if(!phase)return;show(`<b>${esc(phase.banner||phase.id)}</b>`,true);const block=Number.isInteger(phase.scenarioPhase)?stage.comm[phase.scenarioPhase]:null;if(block)queue=block.lines.map(([k,s,t])=>[k,s,t,block.head]);clearTimeout(timer);if(queue.length)timer=setTimeout(pump,block?1800:1500);});
  let latest=null;addEventListener("aftersignal:reward-committed",event=>{latest=event.detail||null},{capture:true});
  window.aftersignalCompleteBattle=()=>{
    const next=stage.hasOutro?"chapterStory":"campaign",nextId=C.nextStageId(stage.id);
    C.writeLaunch(stage.hasOutro?{stageId:stage.id,phase:"outro"}:{stageId:nextId||stage.id,phase:"map",from:stage.id});
    try{localStorage.removeItem(`aftersignal:combat:${stage.id}:v1`)}catch{}
    const pending={stage:C.stageKey(stage.id),next,afterScreen:next,nextStage:nextId,token:`${latest?.transactionId||stage.id}:${launch.at||Date.now()}`,createdAt:Date.now()};
    if(parent!==window)parent.postMessage({type:"aftersignal:battle-complete",...pending},"*");
    else{localStorage.setItem("aftersignal:pending-reward:v3",JSON.stringify(pending));location.href="reward.html";}
    return pending;
  };
})();</script><script src="../shared/shelter/AFTERSIGNAL_SORTIE_VOICE_V1.js?build=20260930sv11"></script></body></html>
