    .story[data-mode^="chapter"] .speaker{justify-content:center}.story[data-mode^="chapter"] .speaker strong{display:none}.story[data-mode^="chapter"] .chapter-title{display:block}.story[data-mode^="chapter"] .line{margin-left:auto;margin-right:auto;font-size:19px}.story[data-mode="chapter-end"] .end-action{display:block}.story[data-mode^="chapter"] .advance{display:none}

    </section>

  <script>
    const scenes = [{"speaker":"서술","label":"PROLOGUE // P-02","title":"관 속의 목소리","text":"비상 전력이 되살아난 뒤, 침수 통로의 수면 아래로 오래된 유도등이 한 칸씩 켜진다.","mode":"chapter-open"},{"speaker":"서술","label":"R-0 LUMEN // LOWER ROUTE","text":"캡슐 유리에 남은 손자국과 새로 맺힌 성에가 겹쳐 있다. 43년 전 근무 교대 방송 사이로 현재의 구조 신호가 끊겨 들어온다.","mode":"wide"},{"speaker":"미라 보스","label":"FIELD LINK // MIRA","text":"제어실 아래 인격 보관실까지 280미터. 오른쪽 통로는 침수됐고, 왼쪽 통로에는 신호 기생체 반응이 있습니다.","mode":"mira"},{"speaker":"사령관","label":"RELAY // UNKNOWN ID","text":"호칭은 계속 보류해. 나는 아직 내 이름도, 과거도 기억하지 못해. 이동 경로와 철수 조건만 승인하겠다.","mode":"first"},{"speaker":"미라 보스","label":"FIELD LINK // MIRA","text":"동의합니다. 사격과 현장 판단은 제가 맡고, 감지 정보는 가공하지 않은 원본과 함께 먼저 공유하겠습니다.","mode":"mira-close"},{"speaker":"기지 시스템","label":"IDENTITY HANDSHAKE","text":"생체 키 재확인. 구 릴레이 지휘 권한 복구를 다시 요청합니다. 현재 인격과 과거 기록의 연속성은 검증할 수 없습니다.","mode":"system"},{"speaker":"사령관","label":"RELAY // UNKNOWN ID","text":"몇 번을 확인해도 일치하는 건 몸뿐이야. 시스템이 권한을 돌려줘도, 내가 그 사람이라는 증거가 되진 않아.","mode":"first"},{"speaker":"미라 보스","label":"FIELD LINK // MIRA","text":"맞습니다. 그래서 제가 알고 있는 과거를 먼저 정답처럼 강요하지 않겠습니다. 보관실의 원본부터 확인하죠.","mode":"mira"},{"speaker":"서술","label":"ARCHIVE APPROACH","text":"무너진 플랫폼 너머에서 관처럼 긴 보관 캡슐들이 모습을 드러낸다. 하나의 캡슐만 희미한 청록빛을 유지하고 있다.","mode":"archive"},{"speaker":"아카이브 음성","label":"DEGRADED RECORD // MIRA VOSS","text":"……호출명 확인. 구 릴레이 지휘관, 응답해 주십시오.","mode":"archive-voice"},{"speaker":"사령관","label":"RELAY // UNKNOWN ID","text":"아까 들린 그 목소리야. 호칭을 읽은 게 아니라, 나를 먼저 알고 있던 목소리였어.","mode":"first"},{"speaker":"미라 보스","label":"FIELD LINK // MIRA","text":"아까는 프레임 정착 오류라고 했지만, 오류라고 단정할 근거는 없습니다. 제가 숨긴 부분이 있다는 의심은 타당합니다.","mode":"mira-dim"},{"speaker":"사령관","label":"RELAY // UNKNOWN ID","text":"그럼 지금 전부 설명할 수 있어?","mode":"first"},{"speaker":"미라 보스","label":"FIELD LINK // MIRA","text":"아니요. 제 현재 프레임에는 그 기억이 온전히 없습니다. 보관실을 지켜 원본을 복구해야 확인할 수 있습니다.","mode":"mira-close"},{"speaker":"사령관","label":"RELAY // UNKNOWN ID","text":"좋아. 모르는 건 모른다고 기록해. 대신 알고 있는 위험과 철수선은 지금 공개해.","mode":"first"},{"speaker":"미라 보스","label":"FIELD LINK // MIRA","text":"전진선, 구조선, 철수선을 분리했습니다. 어느 한쪽이 끊겨도 다른 두 채널은 유지됩니다. 제 프레임 정착률은 71퍼센트입니다.","mode":"mira"},{"speaker":"기지 시스템","label":"HOSTILE SIGNAL","text":"신호 기생체 및 기억 포식 드론 접근. 인격 보관실 외벽 손상까지 96초. 미라 보스 프레임 정착 절차가 중단되었습니다.","mode":"alert"},{"speaker":"사령관","label":"RELAY // LIMITED COMMAND","text":"목표를 다시 확인한다. 보관실 방어와 미라의 정착 완료가 우선이다. 적 처치는 그다음이야.","mode":"first"},{"speaker":"미라 보스","label":"FIELD LINK // MIRA","text":"확인. 왼팔 감각이 늦지만 교정 핑은 사용할 수 있습니다. 사격 판단은 제가, 철수 판단은 당신이 맡습니다.","mode":"mira-ready"},{"speaker":"사령관","label":"RELAY // LIMITED COMMAND","text":"과거의 내가 아니라 지금의 나에게 보고해. 그리고 무리하면 즉시 물러나. 설명할 기회를 잃게 두지 않겠어.","mode":"first"},{"speaker":"서술","label":"OPERATION LINK READY","title":"P-02 전투 준비","text":"인격 보관실을 방어하며 미라의 프레임 정착을 완료하십시오. 신호 기생체와 기억 포식 드론이 접근 중입니다.","mode":"chapter-end"}];
    const story=document.getElementById("story"),dialogue=document.getElementById("dialogue"),speaker=document.getElementById("speaker"),label=document.getElementById("label"),line=document.getElementById("line"),chapterTitle=document.getElementById("chapterTitle"),progress=document.getElementById("progress");
    let index=0,auto=false,timer=0,hidden=false;
    function render(nextIndex,instant=false){index=Math.max(0,Math.min(scenes.length-1,nextIndex));const scene=scenes[index];if(!instant)dialogue.classList.add("changing");clearTimeout(timer);setTimeout(()=>{story.dataset.mode=scene.mode;speaker.textContent=scene.speaker;dialogue.toggleAttribute("data-af-narration",scene.speaker==="서술"&&!/^chapter/.test(scene.mode));label.textContent=scene.label;line.textContent=scene.text;chapterTitle.textContent=scene.title||"";progress.style.width=((index+1)/scenes.length*100)+"%";dialogue.classList.remove("changing");scheduleAuto()},instant?0:120)}
    function next(){if(index<scenes.length-1)render(index+1)}
    function scheduleAuto(){clearTimeout(timer);if(!auto||index>=scenes.length-1)return;timer=setTimeout(next,Math.max(Math.min(9000,2300+scenes[index].text.length*66),window.AfterSignalStoryVoice?.holdMs()||0))}
    dialogue.addEventListener("click",event=>{if(!event.target.closest("button"))next()});dialogue.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();next()}});
    document.addEventListener("keydown",event=>{if(event.key===" "||event.key==="Enter"||event.key==="ArrowRight"){event.preventDefault();next()}if(event.key.toLowerCase()==="a")document.getElementById("autoButton").click()});
    document.getElementById("autoButton").addEventListener("click",function(){auto=!auto;this.textContent=auto?"● AUTO":"AUTO";scheduleAuto()});
    document.getElementById("hideButton").addEventListener("click",function(){hidden=!hidden;dialogue.style.visibility=hidden?"hidden":"visible";this.textContent=hidden?"◩ SHOW":"HIDE"});
